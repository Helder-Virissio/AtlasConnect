<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre - AtlasConnect</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <a href="/">
                    <img src="/public/assets/images/logo-ac.svg" alt="Atlas Connect">
                </a>
            </div>

            <button class="mobile-menu-btn" id="btn-mobile">
                <span class="hamburguer"></span>
            </button>
            
            <nav class="nav-menu" id="nav">
                <ul class="nav-list">
                    <li><a href="/">Início</a></li>
                    <li><a href="/paises">Países</a></li>
                    <li><a href="/sobre">Sobre</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>

            <div class="login-wrapper has-dropdown" id="menu-login">
                <a href="#" class="login-link">Login ▾</a>
                <div class="dropdown-content login-box" id="dropdown-login">
                    <p class="login-title">Faça seu login ou cadastre-se</p>
                    <input type="email" id="login-email" placeholder="E-mail">
                    <input type="password" id="login-password" placeholder="Senha">
                    <div class="login-actions">
                        <button class="btn btn-primary btn-entrar" id="btn-entrar">Entrar</button>
                        <button class="btn btn-secondary btn-cadastrar" id="btn-cadastrar">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        </main>

    <script src="/public/js/script.js" defer></script>
</body>

<footer class="footer-atlas">
    <div class="footer-inner">
        <div class="footer-column footer-info">
            <img src="/public/assets/images/logo-ac.png" alt="Atlas Connect" class="f-logo">
            <p>Conectando bolsistas a oportunidades com transparência e automação.</p>
        </div>   
        </div>
</footer>
</html>
