<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Mentor - Atlas Connect</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            
            <div class="back-navigation">
                <a href="../index.html" class="back-link">
                    <span class="arrow">←</span> Voltar
                </a>
            </div>

            <div class="logo-container">
                <img src="../assets/images/logo-ac.png" alt="Atlas Connect" class="logo-img">
            </div>
            
            <h2 class="register-title">Torne-se um Mentor</h2>
            <p class="register-subtitle">Junte-se à maior rede de bolsistas do Brasil.</p>

            <div class="switch-link">
                <p>Não é um mentor? <a href="cadastro.html">Cadastre-se como Estudante</a></p>
            </div>

            <form id="form-cadastro-profissional">
                <div class="input-group">
                    <label for="nome-prof">Nome</label>
                    <input type="text" id="nome-prof" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email-prof">E-mail</label>
                    <input type="email" id="email-prof" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="senha-prof">Senha</label>
                    <input type="password" id="senha-prof" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="especialidade">País de atuação</label>
                    <input type="text" id="especialidade" placeholder="Ex: Canadá" required>
                </div>

                <div class="input-group">
                    <label for="curriculo">Link do Currículo/LinkedIn</label>
                    <input type="url" id="curriculo" placeholder="https://linkedin.com/in/perfil" required>
                </div>
                <!-- Seção de upload de certificado (opcional) -->
                 <div class="file-upload-section">
                    <label class="file-label"><!--Certificado de Especialista--></label>
                    <label for="certificado" class="file-drop-area">
                        <span class="file-msg"><!--Selecionar Arquivo--></span>
                        <input type="file" id="certificado" accept=".pdf,.jpg,.png" hidden>
                    </label>
                    <span id="file-name" class="file-name-display"><!--Nenhum arquivo selecionado--></span>
                </div> 

                <button type="submit" class="btn-primary">Concluir Cadastro</button>
            </form>

            <div class="register-footer">
                <p>Já tem uma conta? <a href="../index.html">Faça login</a></p>
            </div>
        </div>
    </div>

    <script src="../js/cadastro-profissional.js"></script>
    <script>
        // Atualiza o nome do arquivo ao selecionar
        document.getElementById('certificado').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : "Nenhum arquivo selecionado";
            document.getElementById('file-name').textContent = fileName;
        });
    </script>
</body>
</html>
